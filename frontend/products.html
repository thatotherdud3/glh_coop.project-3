  <body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

    <nav class="global-nav">
      <div class="nav-left">
        <label for="menu-toggle" class="nav-icon" aria-label="menu">
          <div class="line-1"></div>
          <div class="line-2"></div>
          <div class="line-3"></div>
        </label>
      </div>
      <div class="logo">
        <a href="index.html">G L H // CO-OP</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="nav-item">CART [0]</a>
      </div>
    </nav>
    <aside class="system-menu" id="system-menu">
      <div class="menu-matrix">
        <span
          class="system-label text-sage"
          style="display: block; margin-bottom: 60px"
          >System Wayfinding</span
        >
        <nav class="menu-nav">
          <a href="index.html" class="menu-link">Home</a>
          <a href="farmers.html" class="menu-link">Our Farmers</a>
          <a href="producer-login.html" class="menu-link">Producer Node</a>
          <a href="customer-login.html" class="menu-link">Customer Node</a>
          <a href="batch-trace.html" class="menu-link">Batch Trace</a>
          <a href="drop-nodes.html" class="menu-link">Delivery/<br />Collection</a>
          <a href="kitchen-hub.html" class="menu-link">Kitchen Hub</a>
          <a href="plant-knowledge.html" class="menu-link">Plant Knowledge</a>
        </nav>
      </div>
    </aside>

    <label for="menu-toggle" class="menu-shield" id="menu-shield"></label>

    <header class="shop-produce-hero">
      <span class="shop-produce-eyebrow">LIVE INVENTORY</span>
      <h1>Shop Produce</h1>
    </header>

    <section class="shop-search-panel" role="search" aria-label="Search produce listings">
      <div class="shop-search-inner">
        <label for="shop-search">SEARCH INVENTORY</label>
        <input id="shop-search" type="search" autocomplete="off"
               placeholder="Search produce, producer or batch..."
               aria-describedby="shop-search-count" />
        <div class="shop-sort-group">
          <label for="shop-sort">SORT BY</label>
          <select id="shop-sort">
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="availability">Availability: in stock first</option>
          </select>
        </div>
        <p id="shop-search-count" role="status" aria-live="polite">LOADING INVENTORY…</p>
      </div>
    </section>

    <main class="product-grid shop-produce-grid" id="shop-inventory-grid"></main>

    <footer class="massive-footer">
      <div class="footer-content">
        <h2>TRACEABLE.<br />LOCAL.<br />VERIFIED.</h2>
      </div>
      <p class="site-copyright">© 2026 THATOTHERCOMPANY. ALL RIGHTS RESERVED.</p>
    </footer>
    <script src="app.js?v=glh-session-sort-polish-20261121"></script>
  </body>
