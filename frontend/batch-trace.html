<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLH | Batch Trace</title>
    <link rel="stylesheet" href="style1.css" />
    <link rel="stylesheet" href="batch-trace.css" />
  </head>
  <body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

    <nav class="global-nav">
      <div class="nav-left">
        <label for="menu-toggle" class="nav-icon" aria-label="menu">
          <div class="line-1"></div>
          <div class="line-2"></div>
          <div class="line-3"></div>
        </label>
      </div>
      <div class="logo">
        <a href="index.html">G L H // CO-OP</a>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="nav-item">CART [0]</a>
      </div>
    </nav>

    <aside class="system-menu" id="system-menu">
      <div class="menu-matrix">
        <span
          class="system-label text-sage"
          style="display: block; margin-bottom: 60px"
          >System Wayfinding</span
        >
        <nav class="menu-nav">
          <a href="index.html" class="menu-link">Home</a>
          <a href="products.html" class="menu-link">Shop</a>
          <a href="farmers.html" class="menu-link">Our Farmers</a>
          <a href="producer-login.html" class="menu-link">Producer Node</a>
          <a href="customer-login.html" class="menu-link">Customer Node</a>
          <a href="drop-nodes.html" class="menu-link">Delivery/<br />Collection</a>
          <a href="kitchen-hub.html" class="menu-link">Kitchen Hub</a>
          <a href="plant-knowledge.html" class="menu-link">Plant Knowledge</a>
        </nav>
      </div>
    </aside>

    <label for="menu-toggle" class="menu-shield" id="menu-shield"></label>

    <main class="trace-page">
      <section class="trace-search" aria-label="Batch lookup">
        <p class="trace-eyebrow">COMPLIANCE LEDGER</p>
        <form id="batch-lookup-form" class="trace-form" novalidate>
          <label for="batch-input" class="trace-sr-only">Enter a batch number</label>
          <input type="search" id="batch-input" name="batch" class="trace-input"
            placeholder="ENTER BATCH" maxlength="100" autocomplete="off"
            spellcheck="false" required aria-describedby="batch-search-status" />
          <button type="submit" class="trace-search-btn" id="batch-search-btn">
            TRACE BATCH <span aria-hidden="true">↗</span>
          </button>
        </form>
        <p class="trace-status" id="batch-search-status" role="status" aria-live="polite"></p>
      </section>

      <section id="batch-results" class="trace-results" aria-labelledby="batch-results-heading" hidden>
        <div class="trace-results-heading">
          <div>
            <span class="trace-eyebrow">TRACEABILITY RECORD</span>
            <h2 id="batch-results-heading">Batch Record.</h2>
          </div>
          <div class="trace-identification">
            <span id="batch-reference"></span>
            <strong id="batch-product"></strong>
          </div>
        </div>
        <div class="trace-result-grid">
          <article class="trace-result-cell">
            <span class="trace-result-label">ORIGIN</span>
            <p class="trace-result-value" id="batch-origin"></p>
            <span class="trace-result-note" id="batch-origin-note"></span>
          </article>
          <article class="trace-result-cell">
            <span class="trace-result-label">HARVEST DATE</span>
            <p class="trace-result-value" id="batch-harvest"></p>
            <span class="trace-result-note" id="batch-harvest-note"></span>
          </article>
          <article class="trace-result-cell">
            <span class="trace-result-label">SAFETY CLEARANCE</span>
            <p class="trace-result-value" id="batch-clearance"></p>
            <span class="trace-result-note" id="batch-clearance-note"></span>
          </article>
        </div>
      </section>
    </main>

    <footer class="massive-footer">
      <div class="footer-content">
        <h2>TRACEABLE.<br />LOCAL.<br />VERIFIED.</h2>
      </div>
    </footer>
    <script src="app.js"></script>
    <script src="batch-trace.js"></script>
  </body>
</html>
